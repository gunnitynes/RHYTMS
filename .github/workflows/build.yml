name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-14
            cmake_args: -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          - name: Windows
            os: windows-latest
            cmake_args: ""
          - name: Linux
            os: ubuntu-24.04
            cmake_args: ""
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      OUT: build/RHYTMS_artefacts/Release
    steps:
      - uses: actions/checkout@v4

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxext-dev libxcomposite-dev libfreetype-dev libfontconfig1-dev \
            mesa-common-dev ninja-build

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake_args }}

      - name: Build
        run: cmake --build build --config Release --parallel 4

      # Unsigned bundles are refused by macOS hosts; an ad-hoc signature is
      # enough for a plugin you install yourself.
      - name: Sign (ad-hoc)
        if: runner.os == 'macOS'
        run: |
          for b in "$OUT/VST3/RHYTMS.vst3" "$OUT/AU/RHYTMS.component" "$OUT/Standalone/RHYTMS.app"; do
            codesign --force --deep --sign - "$b"
            codesign --verify --verbose "$b"
          done

      - name: Validate with pluginval
        run: |
          case "${{ runner.os }}" in
            macOS)   PV=pluginval_macOS.zip;   EXE=pluginval.app/Contents/MacOS/pluginval ;;
            Windows) PV=pluginval_Windows.zip; EXE=./pluginval.exe ;;
            Linux)   PV=pluginval_Linux.zip;   EXE=./pluginval ;;
          esac
          curl -sSL -o pv.zip "https://github.com/Tracktion/pluginval/releases/latest/download/$PV"
          unzip -q -o pv.zip
          "$EXE" --strictness-level 5 --skip-gui-tests --validate "$OUT/VST3/RHYTMS.vst3"

      # Zip with tools that keep executable bits and bundle structure intact;
      # the artifact upload alone strips them and the plugin will not load.
      - name: Package
        run: |
          PKG="RHYTMS-${{ matrix.name }}"
          mkdir -p "dist/$PKG"
          cp -R "$OUT/VST3/RHYTMS.vst3" "dist/$PKG/"
          if [ -d "$OUT/AU/RHYTMS.component" ]; then cp -R "$OUT/AU/RHYTMS.component" "dist/$PKG/"; fi
          cp -R "$OUT/Standalone/"* "dist/$PKG/"
          cp packaging/INSTALL-${{ matrix.name }}.txt "dist/$PKG/INSTALL.txt"
          cd dist
          case "${{ runner.os }}" in
            macOS)   ditto -c -k --sequesterRsrc --keepParent "$PKG" "$PKG.zip" ;;
            Windows) 7z a -tzip "$PKG.zip" "$PKG" > /dev/null ;;
            Linux)   tar -czf "$PKG.tar.gz" "$PKG" ;;
          esac
          rm -rf "$PKG"
          ls -la

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: RHYTMS-${{ matrix.name }}
          path: dist/*
